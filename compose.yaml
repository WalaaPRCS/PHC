services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phc
      POSTGRES_USER: phc_app
    volumes:
      - phc-postgres:/var/lib/postgresql/data
      - phc-runtime-secrets:/run/phc-secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: phc
      DB_USER: phc_app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - phc-runtime-secrets:/run/phc-secrets:ro
    networks: [internal]
volumes:
  phc-postgres:
  phc-runtime-secrets:
networks:
  internal:
    internal: true
